<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <title>ULTIDA Utility Wall External and Internal Elevation</title>
  <desc>Millimetre drawing based on approved supplied dimensions. External and internal views.</desc>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#8b8b8b" stroke-width="2"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/></marker>
    <style>
      .wall{fill:#fff;stroke:#111827;stroke-width:4}.cab{fill:#eef2f7;stroke:#173b73;stroke-width:3}.granite{fill:#31343a;stroke:#111827;stroke-width:3}.glass{fill:#dbeafe;fill-opacity:.6;stroke:#173b73;stroke-width:3}.dim{stroke:#e11d48;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#e11d48;stroke-width:2}.txt{font-family:Arial,sans-serif;font-size:22px;fill:#111827}.small{font-family:Arial,sans-serif;font-size:17px;fill:#111827}.dimtxt{font-family:Arial,sans-serif;font-size:18px;fill:#e11d48}.label{font-family:Arial,sans-serif;font-size:20px;fill:#173b73;font-weight:bold}.note{font-family:Arial,sans-serif;font-size:18px;fill:#374151}.title{font-family:Arial,sans-serif;font-size:28px;fill:#fff;font-weight:bold}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="#f8fafc"/>
  <rect x="0" y="0" width="2400" height="70" fill="#71401f"/><text x="34" y="45" class="title">UTILITY WALL | EXTERNAL + INTERNAL ELEVATION</text><text x="1870" y="45" class="title">UNITS: MM</text>

  <!-- external view: scale 0.65, origin 90,270 -->
  <g id="external" transform="translate(90,255) scale(.65)">
    <rect x="0" y="0" width="1596" height="2662" class="wall"/>
    <rect x="0" y="0" width="1596" height="110" fill="url(#hatch)"/><text x="20" y="75" class="small">CEILING / WALL ZONE</text>
    <rect x="0" y="2552" width="1596" height="110" fill="url(#hatch)"/><text x="35" y="2618" class="small">SKIRTING 110</text>
    <rect x="0" y="1782" width="396" height="770" class="cab"/><rect x="396" y="1782" width="600" height="770" class="cab"/><rect x="996" y="1782" width="600" height="770" class="cab"/>
    <rect x="0" y="1762" width="1596" height="20" class="granite"/><text x="1170" y="1754" class="label">20 GRANITE</text>
    <rect x="204" y="545" width="1188" height="885" class="glass"/><line x1="600" y1="545" x2="600" y2="1430" stroke="#173b73" stroke-width="3"/><line x1="996" y1="545" x2="996" y2="1430" stroke="#173b73" stroke-width="3"/>
    <rect x="0" y="0" width="204" height="545" class="cab"/><rect x="1392" y="0" width="204" height="545" class="cab"/><rect x="0" y="0" width="1596" height="545" fill="none" stroke="#173b73" stroke-width="3"/>
    <line x1="0" y1="545" x2="1596" y2="545" stroke="#173b73" stroke-width="3"/><text x="500" y="1000" class="label">WINDOW 1188 x 885</text><text x="55" y="2160" class="label">SINK / BASE 396</text><text x="550" y="2160" class="label">DISHWASHER 600</text><text x="1120" y="2160" class="label">WASHING MACHINE 600</text>
    <text x="10" y="-80" class="txt">EXTERNAL ELEVATION - UTILITY WALL</text>
    <!-- dimensions -->
    <line x1="0" y1="2740" x2="1596" y2="2740" class="dim"/><line x1="0" y1="2662" x2="0" y2="2780" class="ext"/><line x1="1596" y1="2662" x2="1596" y2="2780" class="ext"/><text x="700" y="2800" class="dimtxt">1596 OVERALL</text>
    <line x1="0" y1="2860" x2="396" y2="2860" class="dim"/><line x1="396" y1="2860" x2="996" y2="2860" class="dim"/><line x1="996" y1="2860" x2="1596" y2="2860" class="dim"/><text x="140" y="2900" class="dimtxt">396</text><text x="650" y="2900" class="dimtxt">600</text><text x="1240" y="2900" class="dimtxt">600</text>
    <line x1="1710" y1="0" x2="1710" y2="2662" class="dim"/><text x="1740" y="1340" class="dimtxt" transform="rotate(90 1740 1340)">2662 CEILING</text><line x1="1810" y1="1762" x2="1810" y2="2662" class="dim"/><text x="1840" y="2240" class="dimtxt" transform="rotate(90 1840 2240)">900 TO CEILING ZONE</text>
    <line x1="-120" y1="1762" x2="-120" y2="2662" class="dim"/><text x="-160" y="2220" class="dimtxt" transform="rotate(-90 -160 2220)">880 COUNTER TOP</text><line x1="-220" y1="877" x2="-220" y2="1762" class="dim"/><text x="-260" y="1390" class="dimtxt" transform="rotate(-90 -260 1390)">885 WINDOW</text>
  </g>

  <!-- internal view -->
  <g id="internal" transform="translate(1320,255) scale(.65)">
    <rect x="0" y="0" width="1596" height="2662" class="wall"/><rect x="0" y="0" width="1596" height="110" fill="url(#hatch)"/><rect x="0" y="2552" width="1596" height="110" fill="url(#hatch)"/>
    <rect x="0" y="1782" width="396" height="770" class="cab"/><line x1="0" y1="2170" x2="396" y2="2170" stroke="#173b73" stroke-width="3"/><text x="95" y="2050" class="label">SINK UNIT</text><text x="100" y="2300" class="small">PLUMBING / SERVICE ZONE</text>
    <rect x="396" y="1782" width="600" height="770" class="cab"/><rect x="996" y="1782" width="600" height="770" class="cab"/><text x="560" y="2200" class="label">DISHWASHER</text><text x="1150" y="2200" class="label">WASHING MACHINE</text>
    <rect x="0" y="1762" width="1596" height="20" class="granite"/><text x="620" y="1754" class="label">20 GRANITE / SERVICE OPENINGS TO SITE DIMENSIONS</text>
    <rect x="204" y="545" width="1188" height="885" class="glass"/><line x1="600" y1="545" x2="600" y2="1430" stroke="#173b73" stroke-width="3"/><line x1="996" y1="545" x2="996" y2="1430" stroke="#173b73" stroke-width="3"/><text x="530" y="1000" class="label">WINDOW VOID</text>
    <rect x="0" y="0" width="1596" height="545" fill="none" stroke="#173b73" stroke-width="3"/><line x1="204" y1="0" x2="204" y2="545" stroke="#173b73" stroke-width="3"/><line x1="1392" y1="0" x2="1392" y2="545" stroke="#173b73" stroke-width="3"/><text x="470" y="300" class="label">UPPER STORAGE / LOFT ZONE</text>
    <text x="10" y="-80" class="txt">INTERNAL ELEVATION - UTILITY WALL</text>
    <line x1="0" y1="2740" x2="1596" y2="2740" class="dim"/><text x="700" y="2800" class="dimtxt">1596 OVERALL</text><line x1="1710" y1="0" x2="1710" y2="2662" class="dim"/><text x="1740" y="1340" class="dimtxt" transform="rotate(90 1740 1340)">2662 CEILING</text><line x1="-120" y1="0" x2="-120" y2="2662" class="dim"/><text x="-160" y="1400" class="dimtxt" transform="rotate(-90 -160 1400)">2662</text>
  </g>
  <g transform="translate(60,1400)"><text class="note" x="0" y="0">DESIGN BASIS: supplied site photo + reference render.</text><text class="note" x="0" y="28">ASSUMPTION EXPLICIT: 1596 overall run = 396 sink/base + 600 dishwasher + 600 washing machine.</text><text class="note" x="0" y="56">Window: 1188 W x 885 H; bottom of window 332 above granite. Countertop top 880 above finished floor. Skirting 110.</text><text class="note" x="0" y="84">VERIFY ON SITE BEFORE CNC / CUTLIST RELEASE: appliance manufacturer cut sheets, sink cutout, service openings, wall plumb, and window frame offsets.</text></g>
</svg>
