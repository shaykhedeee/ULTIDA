<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1300" viewBox="0 0 2400 1300">
 <title>ULTIDA Wardrobe Internal Elevation</title>
 <desc>Internal wardrobe elevation with equal shelf spacing, hanger zones, drawers and lofts.</desc>
 <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="2"/></pattern><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e11d48"/></marker><style>.wall{fill:#fff;stroke:#111827;stroke-width:4}.case{fill:#f8fafc;stroke:#173b73;stroke-width:3}.part{fill:#fff;stroke:#173b73;stroke-width:3}.shelf{stroke:#173b73;stroke-width:4}.dim{stroke:#e11d48;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.ext{stroke:#e11d48;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#111827;font-size:22px}.l{font-family:Arial,sans-serif;fill:#173b73;font-size:18px;font-weight:bold}.d{font-family:Arial,sans-serif;fill:#e11d48;font-size:17px}.n{font-family:Arial,sans-serif;fill:#374151;font-size:17px}.title{font-family:Arial,sans-serif;fill:#fff;font-size:27px;font-weight:bold}</style></defs>
 <rect width="2400" height="1300" fill="#f8fafc"/><rect width="2400" height="68" fill="#71401f"/><text x="30" y="44" class="title">WARDROBE INTERNAL ELEVATION | APPROVED MODULE DIVISION</text><text x="2050" y="44" class="title">MM</text>
 <!-- scale .68, drawing origin 110,190; cabinet width 3003, height 1990 -->
 <g transform="translate(110,190) scale(.68)">
  <rect x="0" y="0" width="3003" height="2100" class="wall"/><rect x="0" y="0" width="3003" height="110" fill="url(#hatch)"/><text x="40" y="70" class="n">LOFT / TOP CLEARANCE ZONE</text><rect x="0" y="1990" width="3003" height="110" fill="url(#hatch)"/><text x="1250" y="2060" class="n">SKIRTING 110</text>
  <!-- lofts: 5 equal bays over the main storage zone -->
  <g id="lofts"><rect x="630" y="110" width="2373" height="624" fill="#fff" stroke="#173b73" stroke-width="4"/><line x1="1104.6" y1="110" x2="1104.6" y2="734" class="shelf"/><line x1="1579.2" y1="110" x2="1579.2" y2="734" class="shelf"/><line x1="2053.8" y1="110" x2="2053.8" y2="734" class="shelf"/><line x1="2528.4" y1="110" x2="2528.4" y2="734" class="shelf"/><text x="820" y="440" class="l">LOFT</text><text x="1295" y="440" class="l">LOFT</text><text x="1770" y="440" class="l">LOFT</text><text x="2240" y="440" class="l">LOFT</text><text x="2715" y="440" class="l">LOFT</text></g>
  <!-- left 600 bay: three drawer stack and adjustable storage above -->
  <rect x="30" y="734" width="600" height="1256" class="case"/><line x1="30" y1="1132" x2="630" y2="1132" class="shelf"/><line x1="30" y1="1392" x2="630" y2="1392" class="shelf"/><line x1="30" y1="1652" x2="630" y2="1652" class="shelf"/><text x="210" y="920" class="l">AS / EQ</text><text x="210" y="1030" class="l">AS / EQ</text><text x="210" y="1240" class="l">DRAWER</text><text x="210" y="1500" class="l">DRAWER</text><text x="210" y="1780" class="l">DRAWER</text>
  <!-- 543 service/accessory bay -->
  <rect x="630" y="734" width="543" height="1256" class="case"/><line x1="630" y1="1000" x2="1173" y2="1000" class="shelf"/><line x1="630" y1="1260" x2="1173" y2="1260" class="shelf"/><line x1="630" y1="1520" x2="1173" y2="1520" class="shelf"/><line x1="630" y1="1780" x2="1173" y2="1780" class="shelf"/><text x="815" y="900" class="l">HANGER / ACCESSORY</text><text x="800" y="1130" class="l">AS / EQ</text><text x="800" y="1390" class="l">AS / EQ</text><text x="800" y="1650" class="l">DRAWER</text><text x="800" y="1900" class="l">DRAWER</text>
  <!-- four equal 450 bays: two hanger bays and two shelf/drawer bays -->
  <g id="main-bays"><rect x="1173" y="734" width="1800" height="1256" class="case"/><line x1="1623" y1="734" x2="1623" y2="1990" class="shelf"/><line x1="2073" y1="734" x2="2073" y2="1990" class="shelf"/><line x1="2523" y1="734" x2="2523" y2="1990" class="shelf"/><line x1="1173" y1="1450" x2="1623" y2="1450" class="shelf"/><line x1="1623" y1="1450" x2="2073" y2="1450" class="shelf"/><line x1="2073" y1="1150" x2="2523" y2="1150" class="shelf"/><line x1="2523" y1="1150" x2="2973" y2="1150" class="shelf"/><line x1="1173" y1="1720" x2="2073" y2="1720" class="shelf"/><line x1="2073" y1="1720" x2="2973" y2="1720" class="shelf"/><text x="1265" y="1080" class="l">HANGER SPACE</text><text x="1715" y="1080" class="l">HANGER SPACE</text><text x="2180" y="950" class="l">AS / EQ</text><text x="2630" y="950" class="l">AS / EQ</text><text x="1265" y="1600" class="l">DRAWER</text><text x="1715" y="1600" class="l">DRAWER</text><text x="2180" y="1350" class="l">AS / EQ</text><text x="2630" y="1350" class="l">AS / EQ</text><text x="1265" y="1870" class="l">DRAWER</text><text x="1715" y="1870" class="l">DRAWER</text><text x="2180" y="1870" class="l">DRAWER</text><text x="2630" y="1870" class="l">DRAWER</text></g>
  <text x="0" y="-90" class="t">WARDROBE INTERNAL ELEVATION | EQUAL-SHELF STORAGE LOGIC</text>
  <!-- overall and segment dimensions -->
  <line x1="0" y1="2180" x2="3003" y2="2180" class="dim"/><line x1="0" y1="2100" x2="0" y2="2220" class="ext"/><line x1="3003" y1="2100" x2="3003" y2="2220" class="ext"/><text x="1370" y="2240" class="d">3003 OVERALL</text>
  <line x1="30" y1="2300" x2="630" y2="2300" class="dim"/><line x1="630" y1="2300" x2="1173" y2="2300" class="dim"/><line x1="1173" y1="2300" x2="1623" y2="2300" class="dim"/><line x1="1623" y1="2300" x2="2073" y2="2300" class="dim"/><line x1="2073" y1="2300" x2="2523" y2="2300" class="dim"/><line x1="2523" y1="2300" x2="2973" y2="2300" class="dim"/><text x="260" y="2340" class="d">600</text><text x="855" y="2340" class="d">543</text><text x="1350" y="2340" class="d">450</text><text x="1800" y="2340" class="d">450</text><text x="2250" y="2340" class="d">450</text><text x="2700" y="2340" class="d">450</text>
  <line x1="3150" y1="0" x2="3150" y2="2100" class="dim"/><text x="3190" y="1150" class="d" transform="rotate(90 3190 1150)">2100 INCLUDING SKIRTING</text><line x1="3250" y1="110" x2="3250" y2="1990" class="dim"/><text x="3290" y="1100" class="d" transform="rotate(90 3290 1100)">1990 CABINET BODY</text>
  <line x1="3400" y1="734" x2="3400" y2="1990" class="dim"/><text x="3440" y="1400" class="d" transform="rotate(90 3440 1400)">1256 MAIN STORAGE ZONE</text>
 </g>
 <text x="55" y="1190" class="n">DESIGN BASIS: supplied reference elevation. Internal arrangement is evenly distributed within the given bay widths.</text><text x="55" y="1218" class="n">Rules: 18 mm panels; 110 mm skirting; 1990 mm cabinet body; 2100 mm total wardrobe height. Verify hardware and exact shelf clearances before fabrication.</text><text x="55" y="1246" class="n">AS/EQ = adjustable/equal shelf. Hanger zones are intentionally kept clear of drawer fronts. No AI image is used as dimensional authority.</text>
</svg>
