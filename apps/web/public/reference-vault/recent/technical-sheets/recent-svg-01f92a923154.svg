<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
<defs>
<pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#9aa0a6" stroke-width="1"/></pattern>
<pattern id="glass" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#5790c3" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e11d48"/></marker>
<style>.sheet{fill:#fff;stroke:#9aa0a6;stroke-width:2}.wall{fill:#fff;stroke:#111;stroke-width:3}.cab{fill:#f7f9fc;stroke:#173b73;stroke-width:3}.open{fill:#fff;stroke:#173b73;stroke-width:3;stroke-dasharray:12 7}.glass{fill:url(#glass);stroke:#173b73;stroke-width:3}.line{fill:none;stroke:#173b73;stroke-width:3}.fine{fill:none;stroke:#173b73;stroke-width:2}.dim{fill:none;stroke:#e11d48;stroke-width:2;marker-start:url(#arr);marker-end:url(#arr)}.head{font:29px Arial;fill:#111;font-weight:bold}.title{font:25px Arial;fill:#111;font-weight:bold}.label{font:17px Arial;fill:#173b73;font-weight:bold}.dimtxt{font:18px Arial;fill:#e11d48;font-weight:bold}.note{font:18px Arial;fill:#222}.small{font:15px Arial;fill:#555}</style>
</defs>
<rect width="2400" height="1500" fill="#f3f5f8"/><rect width="2400" height="78" fill="#71401f"/><text x="30" y="51" fill="white" class="head">UTILITY WALL | DETAILED EXTERNAL + INTERNAL ELEVATION</text><text x="2070" y="48" fill="white" font-family="Arial" font-size="20">ALL MM</text>
