</g><text x="28" y="1070" class="small">Internal view shows equal shelves, sink/plumbing zone, dummy storage, and the empty washing-machine clearance.</text><text x="28" y="1100" class="small">Verify service openings and sink cutout before fabrication.</text></g>
<text x="60" y="1375" class="note">DESIGN BASIS: 1596 overall run | 600 sink base | 396 dummy/base shutter | 600 empty washing-machine space | 880 counter height | 20 granite | 1188 x 885 window | 332 window-to-granite gap | 2662 ceiling.</text><text x="60" y="1410" class="note">The empty bay is intentionally shown without a washing-machine graphic. This is a geometry-coordination elevation, not a fabrication release until site services are verified.</text>
