name: Reliability

on:
  pull_request:
  push:
    branches:
      - main
      - codex/release-recovery-20260728

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python CV dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Locate Chromium
        shell: bash
        run: |
          chromium_path=$(node -p "require('playwright').chromium.executablePath()")
          echo "PUPPETEER_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Run reliability gate
        env:
          ULTIDA_REQUIRE_BROWSER_E2E: 'true'
          CI: 'true'
        run: npm run reliability
